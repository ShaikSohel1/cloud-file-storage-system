# ==============================================================================
# Render Blueprint Configuration (Infrastructure-as-Code)
# Deploys Spring Boot Backend as a Containerized Web Service
# ==============================================================================

services:
  - type: web
    name: cloud-file-storage-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore # Adjust region as appropriate for your database/storage proximity
    healthCheckPath: /actuator/health # or root /
    envVars:
      - key: PORT
        value: 8080
      - key: STORAGE_TYPE
        value: azure
      - key: AZURE_STORAGE_CONTAINER_NAME
        value: cloudstorage-files
      # Secrets and external infrastructure (configure in Render Dashboard)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

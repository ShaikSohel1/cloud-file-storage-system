apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudstorage-ingress
  namespace: cloudstorage
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.cloudstorage.enterprise
    secretName: cloudstorage-tls
  rules:
  - host: api.cloudstorage.enterprise
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
